stages:
  - policy
  - build

variables:
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  CTEST_PARALLEL_LEVEL: '2'
  VCPKG_BINARY_SOURCES: 'clear;files,$CI_PROJECT_DIR/.vcpkg-cache,readwrite'
  LVR3_CI_CMAKE_ARGS: >-
    -DLVR2_BUILD_TESTS=ON
    -DLVR2_BUILD_TOOLS=OFF
    -DLVR2_BUILD_EXAMPLES=OFF
    -DLVR2_BUILD_VIEWER=OFF
    -DLVR2_WITH_CUDA=OFF
    -DLVR2_WITH_OPENCL=OFF
    -DLVR2_WITH_PCL=OFF
    -DLVR2_WITH_KINFU=OFF

.default-smoke:
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential ca-certificates cmake curl git ninja-build pkg-config python3 tar unzip zip

system-optout-policy-smoke:
  stage: policy
  image: ubuntu:24.04
  extends: .default-smoke
  script:
    - cmake --list-presets=all
    - cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/system_optout_semantics.cmake
    - cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/no_vendored_dependencies.cmake
    - cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/no_public_assimp_leakage.cmake
    - cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/required_private_assimp_policy.cmake

vcpkg-smoke-humble:
  stage: build
  image: ros:humble-ros-base-jammy
  extends: .default-smoke
  cache:
    key:
      files:
        - vcpkg.json
      prefix: vcpkg-humble
    paths:
      - .vcpkg-cache/
      - vcpkg_installed/
  script:
    - |
      git clone --depth 1 https://github.com/microsoft/vcpkg.git "$CI_PROJECT_DIR/.vcpkg"
      "$CI_PROJECT_DIR/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      export VCPKG_ROOT="$CI_PROJECT_DIR/.vcpkg"
      cmake --preset vcpkg-release -G Ninja $LVR3_CI_CMAKE_ARGS
      cmake --build --preset build-vcpkg-release --parallel 2 --target lvr2_mesh_io_facade_header_compile lvr2_static_assert_contracts_compile
      ctest --test-dir build-vcpkg-release --output-on-failure -R "lvr2_(mesh_io_facade_header_compile|static_assert_contracts_compile|removed_public_mesh_io_headers|no_public_assimp_leakage|required_private_assimp_policy|no_vendored_dependencies|system_optout_semantics|lvr3_package_identity_smoke|pytest_smoke)"

vcpkg-smoke-jazzy:
  stage: build
  image: ros:jazzy-ros-base-noble
  extends: .default-smoke
  cache:
    key:
      files:
        - vcpkg.json
      prefix: vcpkg-jazzy
    paths:
      - .vcpkg-cache/
      - vcpkg_installed/
  script:
    - |
      git clone --depth 1 https://github.com/microsoft/vcpkg.git "$CI_PROJECT_DIR/.vcpkg"
      "$CI_PROJECT_DIR/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      export VCPKG_ROOT="$CI_PROJECT_DIR/.vcpkg"
      cmake --preset vcpkg-release -G Ninja $LVR3_CI_CMAKE_ARGS
      cmake --build --preset build-vcpkg-release --parallel 2 --target lvr2_mesh_io_facade_header_compile lvr2_static_assert_contracts_compile
      ctest --test-dir build-vcpkg-release --output-on-failure -R "lvr2_(mesh_io_facade_header_compile|static_assert_contracts_compile|removed_public_mesh_io_headers|no_public_assimp_leakage|required_private_assimp_policy|no_vendored_dependencies|system_optout_semantics|lvr3_package_identity_smoke|pytest_smoke)"
