  allow_failure: true
  cache:
    key:
      files:
        - vcpkg.json
      prefix: vcpkg-optional-performance
    paths:
      - .vcpkg-cache/
      - vcpkg_installed/
  script:
    - |
      git clone --depth 1 https://github.com/microsoft/vcpkg.git "$CI_PROJECT_DIR/.vcpkg"
      "$CI_PROJECT_DIR/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      export VCPKG_ROOT="$CI_PROJECT_DIR/.vcpkg"
      cmake --preset performance-baseline-vcpkg-release -G Ninja $LVR3_CI_CMAKE_ARGS
      cmake --build --preset build-vcpkg-performance-baseline-release --parallel 2 --target lvr2_mesh_io_facade_header_compile
