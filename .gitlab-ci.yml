stages:
  - policy
  - build
  - diagnostics

variables:
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  CTEST_PARALLEL_LEVEL: '2'
  VCPKG_BINARY_SOURCES: 'clear;files,$CI_PROJECT_DIR/.vcpkg-cache,readwrite'
  LVR3_CI_CMAKE_ARGS: >-
    -DLVR2_BUILD_TESTS=ON
    -DLVR2_BUILD_TOOLS=OFF
    -DLVR2_BUILD_EXAMPLES=OFF
    -DLVR2_WITH_CUDA=OFF
    -DLVR2_WITH_OPENCL=OFF
    -DLVR2_WITH_PCL=OFF
    -DLVR2_WITH_KINFU=OFF

.default-smoke:
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential ca-certificates cmake curl git ninja-build pkg-config python3 tar unzip zip

system-optout-policy-smoke:
  stage: policy
  image: ubuntu:26.04
  extends: .default-smoke
  script:
    - cmake --version
    - cmake --list-presets=all
    - cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/cmake_toolchain_contract.cmake
    - cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/system_optout_semantics.cmake
    - cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/no_vendored_dependencies.cmake
    - cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/no_public_assimp_leakage.cmake
    - cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/required_private_assimp_policy.cmake
    - cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/diagnostic_hooks_policy.cmake
    - cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/packaging_policy.cmake
    - cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/no_bundled_viewer.cmake
    - cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/cmake_module_audit.cmake
    - cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/source_include_root_guard.cmake
    - cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/lyrical_cxx20_baseline.cmake
    - cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/cxx20_view_span_policy.cmake
    - cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/storage_io_contract_guard.cmake
    - cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/unified_io_namespace_guard.cmake

vcpkg-smoke-lyrical:
  stage: build
  image: ros:lyrical-ros-base-resolute
  extends: .default-smoke
  cache:
    key:
      files:
        - vcpkg.json
      prefix: vcpkg-lyrical
    paths:
      - .vcpkg-cache/
      - vcpkg_installed/
  script:
    - |
      git clone --depth 1 https://github.com/microsoft/vcpkg.git "$CI_PROJECT_DIR/.vcpkg"
      "$CI_PROJECT_DIR/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      export VCPKG_ROOT="$CI_PROJECT_DIR/.vcpkg"
      cmake --preset vcpkg-release -G Ninja $LVR3_CI_CMAKE_ARGS
      cmake --build --preset build-vcpkg-release --parallel 2 --target lvr2_mesh_io_facade_header_compile lvr2_static_assert_contracts_compile lvr2_storage_io_header_compile lvr2_storage_backend_span_contracts lvr2_mapped_file_contracts lvr2_cxx20_view_span_contracts lvr2_cli_parser_contracts
      ctest --test-dir build-vcpkg-release --output-on-failure -R "lvr2_(mesh_io_facade_header_compile|static_assert_contracts_compile|storage_io_header_compile|storage_backend_span_contracts|storage_io_contract_guard|unified_io_namespace_guard|cxx20_view_span_contracts|cxx20_view_span_policy|cli_parser_contracts|removed_public_mesh_io_headers|no_public_assimp_leakage|required_private_assimp_policy|no_vendored_dependencies|no_boost_cli_parser_dependency|boost_stdlib_replacements|no_boost_dependency|mapped_file_contracts|system_optout_semantics|diagnostic_hooks_policy|packaging_policy|no_bundled_viewer|cmake_module_audit|source_include_root_guard|cmake_toolchain_contract|lvr3_package_identity_smoke|lyrical_cxx20_baseline|pytest_smoke)"
      cmake --build --preset build-vcpkg-release --parallel 2 --target lvr2
      cmake --install build-vcpkg-release --prefix "$PWD/build-vcpkg-release/install-smoke"
      vcpkg_prefix="$(find "$PWD/vcpkg_installed" "$PWD/build-vcpkg-release/vcpkg_installed" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -n 1)"
      test -n "$vcpkg_prefix"
      LVR2_PACKAGE_IDENTITY_INSTALL_PREFIX="$PWD/build-vcpkg-release/install-smoke" LVR2_PACKAGE_IDENTITY_CMAKE_PREFIX_PATH="$vcpkg_prefix" cmake -P tests/package_identity/package_identity_verify.cmake

optional-sanitizer-diagnostics:
  stage: diagnostics
  image: ros:lyrical-ros-base-resolute
  extends: .default-smoke
  when: manual
  allow_failure: true
  cache:
    key:
      files:
        - vcpkg.json
      prefix: vcpkg-optional-sanitizer
    paths:
      - .vcpkg-cache/
      - vcpkg_installed/
  script:
    - |
      git clone --depth 1 https://github.com/microsoft/vcpkg.git "$CI_PROJECT_DIR/.vcpkg"
      "$CI_PROJECT_DIR/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      export VCPKG_ROOT="$CI_PROJECT_DIR/.vcpkg"
      cmake --preset sanitizer-vcpkg-debug -G Ninja $LVR3_CI_CMAKE_ARGS
      cmake --build --preset build-vcpkg-sanitizer-debug --parallel 2 --target lvr2_mesh_io_facade_header_compile lvr2_static_assert_contracts_compile
      python3 tests/performance/record_baseline.py --output build-vcpkg-sanitizer-debug/performance-baselines/sanitizer.json --label gitlab-sanitizer --repeat 1 -- ctest --test-dir build-vcpkg-sanitizer-debug --output-on-failure -R "lvr2_(mesh_io_facade_header_compile|static_assert_contracts_compile)"
  artifacts:
    when: always
    paths:
      - build-vcpkg-sanitizer-debug/performance-baselines/*.json

optional-fuzz-seed:
  stage: diagnostics
  image: ros:lyrical-ros-base-resolute
  extends: .default-smoke
  when: manual
  allow_failure: true
  cache:
    key:
      files:
        - vcpkg.json
      prefix: vcpkg-optional-fuzz
    paths:
      - .vcpkg-cache/
      - vcpkg_installed/
  script:
    - |
      git clone --depth 1 https://github.com/microsoft/vcpkg.git "$CI_PROJECT_DIR/.vcpkg"
      "$CI_PROJECT_DIR/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      export VCPKG_ROOT="$CI_PROJECT_DIR/.vcpkg"
      cmake --preset fuzz-vcpkg-debug -G Ninja $LVR3_CI_CMAKE_ARGS
      cmake --build --preset build-vcpkg-fuzz-debug --parallel 2 --target lvr2_mesh_io_fuzz
      python3 tests/performance/record_baseline.py --output build-vcpkg-fuzz-debug/performance-baselines/fuzz.json --label gitlab-fuzz --repeat 1 -- ctest --test-dir build-vcpkg-fuzz-debug --output-on-failure -R "lvr2_mesh_io_fuzz_seed"
  artifacts:
    when: always
    paths:
      - build-vcpkg-fuzz-debug/performance-baselines/*.json

optional-performance-baseline:
  stage: diagnostics
  image: ros:lyrical-ros-base-resolute
  extends: .default-smoke
  when: manual
  allow_failure: true
  cache:
    key:
      files:
        - vcpkg.json
      prefix: vcpkg-optional-performance
    paths:
      - .vcpkg-cache/
      - vcpkg_installed/
  script:
    - |
      git clone --depth 1 https://github.com/microsoft/vcpkg.git "$CI_PROJECT_DIR/.vcpkg"
      "$CI_PROJECT_DIR/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      export VCPKG_ROOT="$CI_PROJECT_DIR/.vcpkg"
      cmake --preset performance-baseline-vcpkg-release -G Ninja $LVR3_CI_CMAKE_ARGS
      cmake --build --preset build-vcpkg-performance-baseline-release --parallel 2 --target lvr2_mesh_io_facade_header_compile
      python3 tests/performance/record_baseline.py --output build-vcpkg-performance-baseline-release/performance-baselines/performance.json --label gitlab-performance --repeat 1 -- ctest --test-dir build-vcpkg-performance-baseline-release --output-on-failure -R "lvr2_performance_baseline_smoke"
  artifacts:
    when: always
    paths:
      - build-vcpkg-performance-baseline-release/performance-baselines/*.json
