name: LVR3 CI smoke

on:
  push:
    branches:
      - main
      - feature/lvr3-development
  pull_request:
    branches:
      - main
      - feature/lvr3-development
  workflow_dispatch:
    inputs:
      run_optional_diagnostics:
        description: 'Run non-gating sanitizer, fuzz, and performance baseline diagnostics'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  CTEST_PARALLEL_LEVEL: '2'
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
  LVR3_CI_CMAKE_ARGS: >-
    -DLVR2_BUILD_TESTS=ON
    -DLVR2_BUILD_TOOLS=OFF
    -DLVR2_BUILD_EXAMPLES=OFF
    -DLVR2_WITH_CUDA=OFF
    -DLVR2_WITH_OPENCL=OFF
    -DLVR2_WITH_PCL=OFF
    -DLVR2_WITH_KINFU=OFF

jobs:
  vcpkg-smoke:
    name: vcpkg smoke (${{ matrix.ros_distro }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: lyrical
            runner: ubuntu-26.04
            container: ros:lyrical-ros-base-resolute
    steps:
      - name: Install CI tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git ninja-build pkg-config tar unzip zip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg-cache
            vcpkg_installed
          key: ${{ runner.os }}-${{ matrix.ros_distro }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.ros_distro }}-vcpkg-

      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Configure vcpkg-first smoke
        run: >-
          cmake --preset vcpkg-release
          -G Ninja
          $LVR3_CI_CMAKE_ARGS

      - name: Build smoke test targets
        run: >-
          cmake --build --preset build-vcpkg-release --parallel 2
          --target lvr2_mesh_io_facade_header_compile
          lvr2_static_assert_contracts_compile
          lvr2_storage_io_header_compile
          lvr2_storage_backend_span_contracts
          lvr2_mapped_file_contracts
          lvr2_cxx20_view_span_contracts
          lvr2_cli_parser_contracts

      - name: Run basic CTest smoke
        run: >-
          ctest --test-dir build-vcpkg-release --output-on-failure
          -R "lvr2_(mesh_io_facade_header_compile|static_assert_contracts_compile|storage_io_header_compile|storage_backend_span_contracts|storage_io_contract_guard|unified_io_namespace_guard|cxx20_view_span_contracts|cxx20_view_span_policy|cli_parser_contracts|removed_public_mesh_io_headers|no_public_assimp_leakage|required_private_assimp_policy|no_vendored_dependencies|no_boost_cli_parser_dependency|boost_stdlib_replacements|no_boost_dependency|mapped_file_contracts|system_optout_semantics|diagnostic_hooks_policy|packaging_policy|no_bundled_viewer|cmake_module_audit|source_include_root_guard|cmake_toolchain_contract|lvr3_package_identity_smoke|lyrical_cxx20_baseline|pytest_smoke)"

      - name: Install/export package smoke
        run: |
          cmake --build --preset build-vcpkg-release --parallel 2 --target lvr2
          cmake --install build-vcpkg-release --prefix "$PWD/build-vcpkg-release/install-smoke"
          vcpkg_prefix="$(find "$PWD/vcpkg_installed" "$PWD/build-vcpkg-release/vcpkg_installed" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -n 1)"
          test -n "$vcpkg_prefix"
          LVR2_PACKAGE_IDENTITY_INSTALL_PREFIX="$PWD/build-vcpkg-release/install-smoke" \
          LVR2_PACKAGE_IDENTITY_CMAKE_PREFIX_PATH="$vcpkg_prefix" \
            cmake -P tests/package_identity/package_identity_verify.cmake

  system-optout-policy:
    name: system opt-out policy smoke
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install policy smoke tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake python3

      - name: List CMake presets
        run: |
          cmake --version
          cmake --list-presets=all

      - name: Run dependency policy smoke checks
        run: |
          cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/cmake_toolchain_contract.cmake
          cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/system_optout_semantics.cmake
          cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/no_vendored_dependencies.cmake
          cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/no_public_assimp_leakage.cmake
          cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/required_private_assimp_policy.cmake
          cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/diagnostic_hooks_policy.cmake
          cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/packaging_policy.cmake
          cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/no_bundled_viewer.cmake
          cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/cmake_module_audit.cmake
          cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/source_include_root_guard.cmake
          cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/lyrical_cxx20_baseline.cmake
          cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/cxx20_view_span_policy.cmake
          cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/storage_io_contract_guard.cmake
          cmake -DLVR2_SOURCE_DIR="$PWD" -P tests/unified_io_namespace_guard.cmake

  optional-diagnostics:
    name: optional diagnostics (${{ matrix.mode }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_optional_diagnostics }}
    continue-on-error: true
    runs-on: ubuntu-26.04
    container: ros:lyrical-ros-base-resolute
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: sanitizer
            configure_preset: sanitizer-vcpkg-debug
            build_preset: build-vcpkg-sanitizer-debug
            binary_dir: build-vcpkg-sanitizer-debug
            build_targets: lvr2_mesh_io_facade_header_compile lvr2_static_assert_contracts_compile
            ctest_regex: 'lvr2_(mesh_io_facade_header_compile|static_assert_contracts_compile)'
          - mode: fuzz
            configure_preset: fuzz-vcpkg-debug
            build_preset: build-vcpkg-fuzz-debug
            binary_dir: build-vcpkg-fuzz-debug
            build_targets: lvr2_mesh_io_fuzz
            ctest_regex: 'lvr2_mesh_io_fuzz_seed'
          - mode: performance
            configure_preset: performance-baseline-vcpkg-release
            build_preset: build-vcpkg-performance-baseline-release
            binary_dir: build-vcpkg-performance-baseline-release
            build_targets: lvr2_mesh_io_facade_header_compile
            ctest_regex: 'lvr2_performance_baseline_smoke'
    steps:
      - name: Install optional diagnostic tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git ninja-build pkg-config python3 tar unzip zip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg-cache
            vcpkg_installed
          key: ${{ runner.os }}-optional-${{ matrix.mode }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-optional-${{ matrix.mode }}-vcpkg-
            ${{ runner.os }}-optional-vcpkg-

      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Configure optional diagnostics
        run: >-
          cmake --preset ${{ matrix.configure_preset }}
          -G Ninja
          $LVR3_CI_CMAKE_ARGS

      - name: Build optional diagnostics
        run: >-
          cmake --build --preset ${{ matrix.build_preset }} --parallel 2
          --target ${{ matrix.build_targets }}

      - name: Record optional diagnostic baseline
        run: >-
          python3 tests/performance/record_baseline.py
          --output ${{ matrix.binary_dir }}/performance-baselines/${{ matrix.mode }}.json
          --label github-${{ matrix.mode }} --repeat 1 --
          ctest --test-dir ${{ matrix.binary_dir }} --output-on-failure
          -R "${{ matrix.ctest_regex }}"

      - name: Upload optional diagnostic baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optional-diagnostics-${{ matrix.mode }}
          path: |
            ${{ matrix.binary_dir }}/performance-baselines/*.json
